<div class="login-wrapper">
  <!-- Glowing Background Accents -->
  <div class="glow-orb orb-primary"></div>
  <div class="glow-orb orb-secondary"></div>

  <div class="login-container">
    <!-- Brand Header -->
    <div class="brand-header">
      <div class="logo-icon-large">
        <ng-icon name="lucideCookingPot" size="32" />
      </div>
      <h1 class="brand-title">TIFFIN</h1>
      <span class="brand-subtitle">Kitchen &amp; Meal Schedule Admin</span>
    </div>

    <!-- Login Card -->
    <div class="card login-card">
      <div class="card-intro">
        <h2>Sign In</h2>
        <p>Enter your credentials to access the kitchen command dashboard.</p>
      </div>

      <!-- Error Feedback -->
      @if (errorMessage(); as err) {
        <div hlmAlert variant="destructive" class="mb-4 py-2.5">
          <p hlmAlertDescription>{{ err }}</p>
        </div>
      }

      <!-- Google OAuth Sign In Button -->
      <button 
        type="button" 
        hlmBtn
        variant="outline"
        (click)="onSignInGoogle()" 
        [disabled]="auth.isAuthenticating() || isGoogleLoading()"
        class="w-full h-11 flex items-center justify-center gap-3 font-semibold text-sm">
        @if (isGoogleLoading() || (auth.isAuthenticating() && !username())) {
          <span class="spinner-google"></span>
          <span>Connecting to Google...</span>
        } @else {
          <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Continue with Google</span>
        }
      </button>

      <!-- Divider -->
      <div class="auth-divider">
        <span>OR WITH USERNAME &amp; PASSWORD</span>
      </div>

      <form (submit)="onSubmit($event)" class="login-form space-y-4">
        <!-- Username Input -->
        <div class="space-y-1.5">
          <label hlmLabel for="username">Username or Email</label>
          <div class="relative">
            <ng-icon name="lucideUser" size="16" class="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground" />
            <input 
              hlmInput
              id="username"
              type="text" 
              [value]="username()" 
              (input)="username.set($any($event.target).value)" 
              placeholder="Enter username"
              autocomplete="username"
              required 
              class="w-full pl-9 h-10 text-sm" />
          </div>
        </div>

        <!-- Password Input -->
        <div class="space-y-1.5">
          <label hlmLabel for="password">Password</label>
          <div class="relative">
            <ng-icon name="lucideLock" size="16" class="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground" />
            <input 
              hlmInput
              id="password"
              [type]="showPassword() ? 'text' : 'password'" 
              [value]="password()" 
              (input)="password.set($any($event.target).value)" 
              placeholder="Enter password"
              autocomplete="current-password"
              required 
              class="w-full pl-9 pr-10 h-10 text-sm" />
            <button 
              type="button" 
              (click)="togglePasswordVisibility()" 
              class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground" 
              [title]="showPassword() ? 'Hide password' : 'Show password'">
              @if (showPassword()) {
                <ng-icon name="lucideEyeOff" size="16" />
              } @else {
                <ng-icon name="lucideEye" size="16" />
              }
            </button>
          </div>
        </div>

        <!-- Options: Remember Me -->
        <div class="flex items-center gap-2 pt-1">
          <hlm-checkbox 
            [checked]="rememberMe()" 
            (checkedChange)="rememberMe.set($event)" />
          <span class="text-xs text-muted-foreground cursor-pointer" (click)="rememberMe.set(!rememberMe())">Remember this device</span>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          hlmBtn
          [disabled]="auth.isAuthenticating()" 
          class="w-full h-11 gap-2 font-semibold">
          @if (auth.isAuthenticating() && username()) {
            <span class="spinner"></span>
            <span>Verifying Credentials...</span>
          } @else {
            <span>Sign In to Dashboard</span>
            <ng-icon name="lucideArrowRight" size="16" />
          }
        </button>
      </form>
    </div>
  </div>
</div>
